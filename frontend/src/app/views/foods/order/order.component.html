<div>
  <div class="card-body" style="min-height: calc(50vh - 193px);">

    <div id="form-container">
      <dx-form id="form" labelMode="floating" [formData]="filterModel">
        <dxi-item itemType="group" [colCount]="4">

          <dxi-item>
            <dx-select-box displayExpr="categoryName" [(dataSource)]="dataCategorySource" (onEnterKey)="search()"
              [value]="dataCategorySource[0]" (onValueChanged)="setValueCategory($event)"></dx-select-box>
            <dxo-label template="Kategori"></dxo-label>
          </dxi-item>
          <dxi-item dataField="Yıl">
            <dx-select-box displayExpr="year" [(dataSource)]="yearList" (onEnterKey)="search()" [value]="currentYear[0]"
              (onValueChanged)="setValueYear($event)"></dx-select-box>
            <dxo-label template="Yıl"></dxo-label>
          </dxi-item>
          <dxi-item>
            <dx-text-box [value]="filterModel.search" placeholder="Ara" (onEnterKey)="search()"
              (onValueChanged)="setValueSearch($event)"></dx-text-box>
            <dxo-label template="Ara"></dxo-label>
          </dxi-item>
          <dxi-item dataField="" [colSpan]="2">
            <button id="button" type="button" class="btn btn-outline-primary" (click)="search()">Ara
            </button>
          </dxi-item>
        </dxi-item>
      </dx-form>
    </div>


    <div class="row">

      <dx-data-grid #orderDataGrid id="gridContainer" [dataSource]="dataSource" keyExpr="ID" [showBorders]="true"
        dataRowTemplate="dataRowTemplateName" [focusedRowEnabled]="true"
        (onSelectionChanged)="onFocusedRowChanged($event)">

        <dxo-selection mode="single"></dxo-selection>
        <dxi-column caption="Resim"></dxi-column>

        <ng-container *dxTemplate="let dto of 'dataRowTemplateName'">

          <div class="mains">
            <div style="width:40%;float:left;display:block;">
              <img *ngIf="dto.data.image===null" class="images" src="assets/images/no_image.jpg" alt="" />
              <img *ngIf="dto.data.image" class="images" [src]="'data:image/png;base64,'+dto.data.image" alt=""
                tabindex="0" />
            </div>

            <div style="width:30%;float:left;display:block;">
              <tr>
                <td>
                  <div class="ordName">{{dto.data.stockName}}</div>
                </td>
                <td>
                  <div class="ordQuantity">({{dto.data.quantity}} {{dto.data.unitType}})</div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="ordPrice">{{dto.data.price}} ₺</div>
                </td>
              </tr>
            </div>

            <div style="width:30%;float:left;display:block;">
              <tr>
                <td>
                  <div class="ordRate">{{dto.data.rateName}}</div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="ordPercent">{{dto.data.percent}}</div>
                </td>
              </tr>
            </div>
          </div>
        </ng-container>


        <dxo-paging [pageSize]="200"></dxo-paging>
        <dxo-pager [visible]="false" [showPageSizeSelector]="true"></dxo-pager>

        <dxo-header-filter [visible]=false></dxo-header-filter>
        <dxo-filter-row [visible]="false"></dxo-filter-row>

        <dxo-remote-operations [groupPaging]="true">
        </dxo-remote-operations>
      </dx-data-grid>
    </div>
  </div>
</div>
