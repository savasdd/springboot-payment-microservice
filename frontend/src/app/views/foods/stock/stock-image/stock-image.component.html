<div class="main-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <div class="card border" style="margin-bottom: 0;">
            <div class="card-body" style="min-height: calc(20vh - 193px);">
              <div class="row">
                <dx-data-grid #stockDataGrid [dataSource]="dataSource" [showBorders]="true">
                  <dxo-editing mode="form" [allowUpdating]="false" [allowAdding]="false" [allowDeleting]="false"
                    [useIcons]="true">
                  </dxo-editing>  

                  <dxo-toolbar>
                    <dxi-item name="addRowButton"></dxi-item>
                    <dxi-item location="after">
                      <dx-button icon="upload" hint="Resim Yükle" (onClick)="openPopapFile()">
                      </dx-button>
                    </dxi-item>
                  </dxo-toolbar>
  
                  <dxi-column dataField="name" caption="İsim" [width]="400">
                  </dxi-column>
                  <dxi-column dataField="image" caption="Resim" cellTemplate="cellTemplate">

                    <div *dxTemplate="let data of 'cellTemplate'">
                      <img *ngIf="data.value" class="images" [src]="'data:image/png;base64,'+data.value" alt="" />
                    </div>
                </dxi-column>
  
                  <dxo-remote-operations [groupPaging]="false">
                  </dxo-remote-operations>
  
                </dx-data-grid>

                <dx-popup [width]="700" [height]="300" [showTitle]="true" title="Resim Yükle" [dragEnabled]="false"
                [hideOnOutsideClick]="false" [showCloseButton]="true" [(visible)]="popupVisible">

                <div *dxTemplate="let data of 'content'">
                  <app-file *ngIf="popupVisible" path="payment/stocks/cdn/upload" [params]="params"
                    (fileEmitter)="fileEmitter($event)"></app-file>
                </div>
              </dx-popup>
  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
